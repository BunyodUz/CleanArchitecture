services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: CleanArchitectureDb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d CleanArchitectureDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Add redis, minio, etc. here as the app needs them.

volumes:
  postgres-data:
